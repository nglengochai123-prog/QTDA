{% load l10n %}{% localize off %}<svg class="chart-svg" viewBox="0 0 {{ c.w }} {{ c.h }}" role="img" aria-label="{{ label }}">
  {% for t in c.ticks %}<line class="grid" x1="{{ c.x0 }}" x2="{{ c.x1 }}" y1="{{ t.y }}" y2="{{ t.y }}"/><text class="axis-text" x="{{ c.x0|add:'-6' }}" y="{{ t.y }}" dy="0.32em" text-anchor="end">{{ t.text }}</text>{% endfor %}
  {% for b in c.bars %}<rect class="series-1" x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="2" tabindex="0" data-tip="{{ b.tip }}"><title>{{ b.tip }}</title></rect>{% if b.show_label %}<text class="axis-text" x="{{ b.lx }}" y="{{ c.label_y }}" text-anchor="middle">{{ b.label }}</text>{% endif %}{% endfor %}
  <line class="baseline" x1="{{ c.x0 }}" x2="{{ c.x1 }}" y1="{{ c.base }}" y2="{{ c.base }}"/>
</svg>{% endlocalize %}
