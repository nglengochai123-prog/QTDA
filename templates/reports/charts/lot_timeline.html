{% load l10n %}{% if c %}<ul class="chart-legend"><li><span class="key s-1" aria-hidden="true"></span>Dự kiến đang dùng lô</li><li><span class="key key-line key-exp" aria-hidden="true"></span>Hạn sử dụng</li><li><span class="key st-critical" aria-hidden="true"></span>Phần dự kiến phải bỏ</li></ul>
<div class="chart-box{% if c.w <= 400 %} chart-box-narrow{% elif c.w > 700 %} chart-box-wide{% endif %}">{% localize off %}<svg class="chart-svg" viewBox="0 0 {{ c.w }} {{ c.h }}" role="img" aria-label="{{ label }}">
  {% for t in c.ticks %}<line class="grid" x1="{{ t.x }}" x2="{{ t.x }}" y1="18" y2="{{ c.h|add:'-6' }}"/><text class="axis-text" x="{{ t.x }}" y="12" text-anchor="middle">{{ t.text }}</text>{% endfor %}
  {% for r in c.rows %}<g class="hit" tabindex="0" data-tip="{{ r.tip }}">
  <text class="axis-text label-text" x="{{ c.label_x }}" y="{{ r.ty }}" dy="0.32em" text-anchor="end">{{ r.rank }}. {{ r.label }}</text>
  {% if r.seg %}<rect class="f-1" x="{{ r.seg.x }}" y="{{ r.y }}" width="{{ r.seg.w }}" height="18" rx="4"/>{% else %}<text class="axis-text" x="{{ c.x0|add:'6' }}" y="{{ r.ty }}" dy="0.32em">chưa tới lượt</text>{% endif %}
  {% if r.exp %}<line class="exp-line" x1="{{ r.exp }}" x2="{{ r.exp }}" y1="{{ r.y|add:'-4' }}" y2="{{ r.y|add:'22' }}"/>{% endif %}
  {% if r.waste %}<rect class="st-critical" x="{{ r.waste.x }}" y="{{ r.y|add:'5' }}" width="8" height="8" rx="2"/><text class="value-text" x="{{ r.waste.x|add:'12' }}" y="{{ r.ty }}" dy="0.32em">{{ r.waste.text }}</text>{% endif %}
  <title>{{ r.tip }}</title></g>{% endfor %}
</svg>{% endlocalize %}</div>{% endif %}
