{% load l10n %}{% if c %}<div class="chart-box{% if c.w <= 400 %} chart-box-narrow{% endif %}">{% localize off %}<svg class="chart-svg" viewBox="0 0 {{ c.w }} {{ c.h }}" role="img" aria-label="{{ label }}">
  {% for t in c.ticks %}<line class="grid{% if forloop.first %} baseline{% endif %}" x1="{{ c.x0 }}" x2="{{ c.x1 }}" y1="{{ t.y }}" y2="{{ t.y }}"/><text class="axis-text" x="{{ c.x0|add:'-8' }}" y="{{ t.y }}" dy="0.32em" text-anchor="end">{{ t.text }}</text>{% endfor %}
  {% for b in c.bars %}<g class="hit" tabindex="0" data-tip="{{ b.tip }}"><rect class="hit-area" x="{{ b.hx }}" y="{{ c.top }}" width="{{ b.hw }}" height="{{ c.plot_h }}"/><path class="{% if b.muted %}f-muted{% else %}f-1{% endif %}" d="{{ b.d }}"/><title>{{ b.tip }}</title></g>{% if b.show_label %}<text class="axis-text" x="{{ b.lx }}" y="{{ c.label_y }}" text-anchor="middle">{{ b.label }}</text>{% endif %}{% endfor %}
</svg>{% endlocalize %}</div>{% endif %}
