{% load l10n %}{% if c %}{% include "reports/charts/legend.html" with items=c.legend %}<div class="chart-box{% if c.w <= 400 %} chart-box-narrow{% endif %}">{% localize off %}<svg class="chart-svg" viewBox="0 0 {{ c.w }} {{ c.h }}" role="img" aria-label="{{ label }}">
  {% for t in c.ticks %}<line class="grid{% if forloop.first %} baseline{% endif %}" x1="{{ c.x0 }}" x2="{{ c.x1 }}" y1="{{ t.y }}" y2="{{ t.y }}"/><text class="axis-text" x="{{ c.x0|add:'-8' }}" y="{{ t.y }}" dy="0.32em" text-anchor="end">{{ t.text }}</text>{% endfor %}
  {% for col in c.cols %}<g class="hit" tabindex="0" data-tip="{{ col.tip }}"><rect class="hit-area" x="{{ col.hx }}" y="{{ c.top }}" width="{{ col.hw }}" height="{{ c.plot_h }}"/>{% for s in col.segs %}<path class="f-{{ s.slot }}" d="{{ s.d }}"/>{% endfor %}<title>{{ col.tip }}</title></g>{% if col.show_label %}<text class="axis-text" x="{{ col.lx }}" y="{{ c.label_y }}" text-anchor="middle">{{ col.label }}</text>{% endif %}{% endfor %}
</svg>{% endlocalize %}</div>{% endif %}
