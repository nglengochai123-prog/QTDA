{% if notes %}<section class="card insight-card" aria-labelledby="notes-{{ id|default:'x' }}">
  <div class="card-head"><div><h2 id="notes-{{ id|default:'x' }}">Nhận định</h2><p class="card-sub">Những điểm đáng chú ý trong kỳ.</p></div></div>
  <ul class="insights">{% for n in notes %}<li>{{ n }}</li>{% endfor %}</ul>
</section>{% endif %}
